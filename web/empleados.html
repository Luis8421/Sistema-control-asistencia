<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Asistencia — Empleados</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0">Empleados</h1>
      <button class="btn btn-primary btn-sm" id="btnNuevo">+ Nuevo empleado</button>
    </div>

    <div class="card p-3 mb-3">
      <form id="formBusqueda" class="row gy-2 gx-2 align-items-end">
        <div class="col-12 col-sm-6">
          <label class="form-label small mb-1" for="busqueda">Buscar por nombre</label>
          <input type="text" class="form-control form-control-sm" id="busqueda" placeholder="Ej: Juan" />
        </div>
        <div class="col-12 col-sm-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-sm flex-fill">Buscar</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLimpiarBusqueda">Limpiar</button>
        </div>
      </form>
    </div>

    <div class="card p-3">
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead>
            <tr>
              <th>Codigo</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Cargo</th>
              <th>Geocerca</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tablaEmpleados">
            <tr><td colspan="7" class="text-center text-muted py-4">Cargando...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-2">
        <span class="text-muted small" id="resumenPaginacion"></span>
        <div class="btn-group">
          <button class="btn btn-outline-secondary btn-sm" id="btnAnterior">Anterior</button>
          <button class="btn btn-outline-secondary btn-sm" id="btnSiguiente">Siguiente</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal crear/editar -->
  <div class="modal fade" id="modalEmpleado" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEmpleado">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalEmpleado">Nuevo empleado</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="empleadoId" />

            <div class="mb-2">
              <label class="form-label small">Nombre completo</label>
              <input type="text" class="form-control" id="nombreCompleto" required />
            </div>

            <div class="mb-2">
              <label class="form-label small">Codigo de empleado</label>
              <input type="text" class="form-control" id="codigoEmpleado" required />
            </div>

            <div class="mb-2">
              <label class="form-label small">Email</label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="mb-2">
              <label class="form-label small">Cargo</label>
              <input type="text" class="form-control" id="cargo" />
            </div>

            <div class="mb-2">
              <label class="form-label small">Geocerca asignada</label>
              <select class="form-select" id="bodegaId" required></select>
            </div>

            <div class="mb-2" id="grupoPassword">
              <label class="form-label small" id="labelPassword">Contrasena</label>
              <input type="password" class="form-control" id="password" />
              <div class="form-text" id="ayudaPassword"></div>
            </div>

            <div class="form-check" id="grupoActivo">
              <input class="form-check-input" type="checkbox" id="activo" checked />
              <label class="form-check-label small" for="activo">Activo</label>
            </div>

            <div id="errorEmpleado" class="alert alert-danger py-2 small mt-2 d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btnGuardarEmpleado">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/empleados.js"></script>
</body>
</html>
