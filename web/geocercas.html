<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Asistencia — Geocercas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0">Geocercas (bodegas)</h1>
      <button class="btn btn-primary btn-sm" id="btnNueva">+ Nueva geocerca</button>
    </div>

    <div class="card p-3">
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Direccion</th>
              <th>Latitud</th>
              <th>Longitud</th>
              <th>Radio (m)</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tablaGeocercas">
            <tr><td colspan="8" class="text-center text-muted py-4">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal crear/editar -->
  <div class="modal fade" id="modalGeocerca" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formGeocerca">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalGeocerca">Nueva geocerca</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="geocercaId" />

            <div class="mb-2">
              <label class="form-label small">Código <span class="text-muted">(opcional)</span></label>
              <input type="text" class="form-control" id="codigo" placeholder="Ej. BQZ1" />
            </div>

            <div class="mb-2">
              <label class="form-label small">Nombre</label>
              <input type="text" class="form-control" id="nombre" required />
            </div>

            <div class="mb-2">
              <label class="form-label small">Direccion</label>
              <input type="text" class="form-control" id="direccion" />
            </div>

            <div class="row">
              <div class="col mb-2">
                <label class="form-label small">Latitud</label>
                <input type="number" step="any" class="form-control" id="latitud" required />
              </div>
              <div class="col mb-2">
                <label class="form-label small">Longitud</label>
                <input type="number" step="any" class="form-control" id="longitud" required />
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small">Radio autorizado (metros)</label>
              <input type="number" step="1" min="1" class="form-control" id="radioMetros" required />
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="activo" checked />
              <label class="form-check-label small" for="activo">Activa</label>
            </div>

            <div id="errorGeocerca" class="alert alert-danger py-2 small mt-2 d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/nav.js"></script>
  <script src="js/geocercas.js"></script>
</body>
</html>
