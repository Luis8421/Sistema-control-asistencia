<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Asistencia — Inicio</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
  <script>
    // Sin sesion no tiene caso ni cargar Bootstrap: al login de una vez.
    // (js/api.js hace este mismo chequeo, pero corre despues de que el
    // resto de la pagina ya se pinto; esto evita ese parpadeo).
    if (!localStorage.getItem("panel_token")) {
      location.replace("login.html");
    }
  </script>
</head>
<body>
  <div id="navbar"></div>

  <div class="container pb-5">
    <h1 class="h4 mb-4">Inicio</h1>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Empleados activos</div>
          <div class="h3 mb-0" id="statEmpleados">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Geocercas activas</div>
          <div class="h3 mb-0" id="statGeocercas">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Marcaciones validas hoy</div>
          <div class="h3 mb-0 text-success" id="statValidas">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Marcaciones invalidas hoy</div>
          <div class="h3 mb-0 text-danger" id="statInvalidas">-</div>
        </div>
      </div>
    </div>

    <div class="card p-3">
      <h2 class="h6 mb-3">En turno ahora mismo</h2>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead>
            <tr>
              <th>Empleado</th>
              <th>Geocerca</th>
              <th>Hora de entrada</th>
              <th>Ubicacion</th>
            </tr>
          </thead>
          <tbody id="tablaEnTurno">
            <tr><td colspan="4" class="text-center text-muted py-4">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ubicacion.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
