<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Asistencia — Indicadores</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container pb-5">
    <h1 class="h4 mb-4">Indicadores de asistencia</h1>

    <div class="card p-3 mb-3">
      <form id="formFiltros" class="row gy-2 gx-2 align-items-end">
        <div class="col-12 col-sm-4">
          <label class="form-label small mb-1" for="filtroEmpleado">Empleado</label>
          <select class="form-select form-select-sm" id="filtroEmpleado" required>
            <option value="">Selecciona un empleado</option>
          </select>
        </div>
        <div class="col-6 col-sm-3">
          <label class="form-label small mb-1" for="filtroDesde">Desde</label>
          <input type="date" class="form-control form-control-sm" id="filtroDesde" />
        </div>
        <div class="col-6 col-sm-3">
          <label class="form-label small mb-1" for="filtroHasta">Hasta</label>
          <input type="date" class="form-control form-control-sm" id="filtroHasta" />
        </div>
        <div class="col-6 col-sm-1">
          <button type="submit" class="btn btn-primary btn-sm w-100">Calcular</button>
        </div>
        <div class="col-6 col-sm-1">
          <button type="button" class="btn btn-outline-success btn-sm w-100" id="btnExportarPdf" disabled>PDF</button>
        </div>
      </form>
    </div>

    <div id="resumen" class="row g-3 mb-3 d-none">
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Dias trabajados</div>
          <div class="h4 mb-0" id="statTrabajados">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Dias con atraso</div>
          <div class="h4 mb-0" id="statAtrasos">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Ausencias</div>
          <div class="h4 mb-0" id="statAusencias">-</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center">
          <div class="text-muted small">Horas trabajadas</div>
          <div class="h4 mb-0" id="statHoras">-</div>
        </div>
      </div>
    </div>

    <div class="card p-3">
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Atraso</th>
              <th>Horas</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tablaDetalle">
            <tr><td colspan="6" class="text-center text-muted py-4">Selecciona un empleado y presiona Calcular</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/indicadores.js"></script>
</body>
</html>
