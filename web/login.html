<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Asistencia — Iniciar sesion</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5" style="max-width: 420px">
    <h1 class="h4 text-center mb-4">Panel de Asistencia</h1>

    <div class="card p-4">
      <p class="text-muted small text-center mb-3">Ingresa con tu cuenta de supervisor o administrador</p>
      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label small" for="usuario">Usuario</label>
          <input type="text" class="form-control" id="usuario" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label small" for="password">Contrasena</label>
          <input type="password" class="form-control" id="password" required autocomplete="current-password" />
        </div>

        <div id="errorLogin" class="alert alert-danger py-2 small d-none"></div>

        <button type="submit" class="btn btn-primary w-100" id="btnLogin">Iniciar sesion</button>
      </form>
    </div>
  </div>

  <script src="js/config.js?v=1"></script>
  <script src="js/login.js?v=4"></script>
</body>
</html>
