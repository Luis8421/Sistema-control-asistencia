<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de Asistencia — Marcaciones</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar"></div>

  <div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0">Marcaciones</h1>
      <button class="btn btn-outline-success btn-sm" id="btnExportarExcel">Exportar a Excel</button>
    </div>

    <div class="card p-3 mb-3">
      <form id="formFiltros" class="row gy-2 gx-2 align-items-end">
        <div class="col-12 col-sm-3">
          <label class="form-label small mb-1" for="filtroFecha">Fecha</label>
          <input type="date" class="form-control form-control-sm" id="filtroFecha" />
        </div>
        <div class="col-12 col-sm-4">
          <label class="form-label small mb-1" for="filtroEmpleado">Empleado</label>
          <select class="form-select form-select-sm" id="filtroEmpleado">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-12 col-sm-3">
          <label class="form-label small mb-1" for="filtroTipo">Tipo</label>
          <select class="form-select form-select-sm" id="filtroTipo">
            <option value="">Todos</option>
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
          </select>
        </div>
        <div class="col-12 col-sm-2 d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-sm flex-fill">Filtrar</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnLimpiar">Limpiar</button>
        </div>
      </form>
    </div>

    <div class="card p-3">
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead>
            <tr>
              <th>Fecha/Hora</th>
              <th>Empleado</th>
              <th>Geocerca</th>
              <th>Tipo</th>
              <th>Distancia</th>
              <th>Estado</th>
              <th>Foto</th>
            </tr>
          </thead>
          <tbody id="tablaMarcaciones">
            <tr><td colspan="7" class="text-center text-muted py-4">Cargando...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-2">
        <span class="text-muted small" id="resumenPaginacion"></span>
        <div class="btn-group">
          <button class="btn btn-outline-secondary btn-sm" id="btnAnterior">Anterior</button>
          <button class="btn btn-outline-secondary btn-sm" id="btnSiguiente">Siguiente</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/marcaciones.js"></script>
</body>
</html>
