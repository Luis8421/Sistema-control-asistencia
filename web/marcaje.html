<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portal de Asistencia</title>

  <!-- PWA: instalable en Android/iPhone/escritorio -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2E86AB" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Asistencia" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4" style="max-width: 480px">
    <h1 class="h4 text-center mb-4">Portal de Asistencia</h1>

    <!-- Login de empleado -->
    <div id="bloqueLogin" class="card p-4">
      <p class="text-muted small text-center mb-3">Ingresa con tu cuenta de empleado</p>
      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label small" for="email">Correo electronico</label>
          <input type="email" class="form-control" id="email" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label small" for="password">Contrasena</label>
          <input type="password" class="form-control" id="password" required autocomplete="current-password" />
        </div>

        <div id="errorLogin" class="alert alert-danger py-2 small d-none"></div>

        <button type="submit" class="btn btn-primary w-100" id="btnLogin">Iniciar sesion</button>
      </form>
    </div>

    <!-- Marcaje (visible tras login) -->
    <div id="bloqueMarcaje" class="d-none">
      <div class="card p-4 mb-3">
        <div class="text-center mb-3">
          <p class="h5 mb-0" id="nombreEmpleado"></p>
          <p class="text-muted small mb-1" id="cargoEmpleado"></p>
          <p class="text-muted small mb-0" id="bodegaEmpleado"></p>
        </div>

        <div class="text-center border-top border-bottom py-2 mb-3">
          <div class="small text-muted" id="fechaHoraActual"></div>
          <div class="mt-1" id="estadoTurno"></div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary flex-fill py-3" id="btnEntrada">Marcar Entrada</button>
          <button class="btn btn-secondary flex-fill py-3" id="btnSalida">Marcar Salida</button>
        </div>

        <div id="resultadoMarcaje" class="alert mt-3 d-none"></div>

        <!-- Panel de diagnostico de GPS: SOLO se muestra si la URL trae
             ?diag=1 (ver marcaje.js). Para pruebas de campo, nunca visible
             para un empleado que entra por el enlace normal. -->
        <div id="panelDiagnostico" class="alert alert-secondary mt-2 d-none small" style="font-family: monospace; white-space: pre-wrap;"></div>

        <!-- Solo visible para admin/supervisor (ver marcaje.js). El Portal de
             Marcaje y el Panel Administrativo son dos sesiones separadas
             (empleado_token vs panel_token) a proposito; este es solo un
             enlace de conveniencia hacia login.html, no un acceso directo —
             evita mezclar los dos mecanismos de sesion. Navega en la MISMA
             pestana (sin target="_blank"): abrir pestana nueva desde una
             pagina file:// puede bloquearse o comportarse de forma
             inconsistente segun el navegador. -->
        <a href="login.html" class="btn btn-link btn-sm mt-2 d-none" id="linkPanelAdmin">Ir al Panel Administrativo →</a>
        <button class="btn btn-link btn-sm mt-2 text-muted" id="btnLogout" type="button">Cerrar sesion</button>
      </div>

      <div class="card p-3">
        <h2 class="h6 mb-3">Historial de hoy</h2>
        <div class="table-responsive">
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Hora</th>
                <th>Tipo</th>
                <th>Bodega</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tablaHistorial">
              <tr><td colspan="4" class="text-center text-muted py-3">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Selector de bodega: solo aparece cuando el GPS coincide con mas de
       una bodega autorizada a la vez (ej. BOCQ y BDCQ, que comparten
       predio) — el backend nunca elige por desempate automatico. -->
  <div class="modal fade" id="modalSeleccionBodega" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Selecciona tu bodega</h5>
        </div>
        <div class="modal-body">
          <p class="text-muted small">Se detectó más de una bodega autorizada en esta ubicación. Selecciona dónde estás registrando tu asistencia.</p>
          <div id="opcionesBodega" class="d-grid gap-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCancelarSeleccionBodega">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/marcaje.js"></script>
</body>
</html>
